{% if user.is_authenticated and user.role == 'CUSTOMER' %}
{% if request.resolver_match.url_name != 'landing' %}
<nav class="mg-mobile-tabbar" aria-label="Customer mobile navigation">
  <a class="mg-mobile-tab {% if request.resolver_match.url_name == 'fitness_home' %}active{% endif %}" href="{% url 'fitness_home' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"/></svg><small>Home</small>
  </a>
  <a class="mg-mobile-tab {% if request.resolver_match.url_name == 'gym_list' or request.resolver_match.url_name == 'gym_detail' %}active{% endif %}" href="{% url 'gym_list' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><small>Explore</small>
  </a>
  <a class="mg-mobile-tab mg-mobile-tab-visit {% if request.resolver_match.url_name == 'my_memberships' or request.resolver_match.url_name == 'my_sessions' or request.resolver_match.url_name == 'session_detail' %}active{% endif %}" href="{% url 'my_memberships' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 9h3v3H8zM14 9h2M14 13h3M8 16h9"/></svg><small>Visit</small>
  </a>
  <a class="mg-mobile-tab {% if request.resolver_match.url_name == 'workout_history' or request.resolver_match.url_name == 'log_workout' or request.resolver_match.url_name == 'update_workout_goal' %}active{% endif %}" href="{% url 'workout_history' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9M12 19V5M19 19v-7"/></svg><small>Activity</small>
  </a>
  <a class="mg-mobile-tab {% if request.resolver_match.url_name == 'profile_hub' or request.resolver_match.url_name == 'edit_profile' or request.resolver_match.url_name == 'more_menu' or request.resolver_match.url_name == 'discover' or request.resolver_match.url_name == 'chat_home' or request.resolver_match.url_name == 'notification_list' %}active{% endif %}" href="{% url 'profile_hub' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"/></svg><small>Profile</small>
  </a>
</nav>
{% endif %}
{% endif %}
